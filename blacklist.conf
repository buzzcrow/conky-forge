# Conky device blacklist — common entries (shared across all PCs)
# Format: type:name
# Supported types: disk, nic
#
# Per-PC overrides go in blacklist-<hostname>.conf (gitignored).
# Examples:
# disk:nvme0n1       — skip this NVMe drive
# disk:sda           — skip this SATA drive
# nic:docker0        — skip docker bridge
# nic:br-abcdef      — skip a bridge interface
# nic:veth1234       — skip container veth

nic:docker0
