-- Conky config for AMD Ryzen 9 5950X + RTX 2080
-- Layout: Single column, right-aligned
-- Theme:  Dark background / Orange accent
-- Screen: 3840x2160 (4K) on DP-4

conky.config = {
    -- Position & Size
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 40,
    minimum_width = 460,
    maximum_width = 460,

    -- Window
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 190,
    own_window_colour = '#1a1a1a',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Borders & Drawing
    border_width = 0,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    stippled_borders = 0,

    -- Font
    use_xft = true,
    xftalpha = 1,
    font = 'DejaVu Sans Mono:size=13',

    -- Behavior
    background = true,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    extra_newline = false,
    short_units = true,

    -- Output
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,

    -- Colors
    -- default text: light gray
    default_color = '#c8c8c8',
    -- color1: bright orange  (section headers)
    color1 = '#ff8c00',
    -- color2: warm orange     (bars, accents)
    color2 = '#e07800',
    -- color3: dim gray        (labels)
    color3 = '#808080',
    -- color4: white           (emphasis values)
    color4 = '#ffffff',
    -- color5: red             (down / warning)
    color5 = '#ff4444',
    -- color6: green           (up / ok)
    color6 = '#66cc66',
}

conky.text = [[
#
# ── DATE / TIME ────────────────────────────────────
#
${color1}${font DejaVu Sans Mono:bold:size=34}${time %H:%M:%S}${font}${color}${alignr}${color3}${font DejaVu Sans Mono:size=16}${time %A}${font}${color}
${color4}${font DejaVu Sans Mono:size=16}${time %Y-%m-%d}${font}${color}${alignr}${color3}${font Noto Sans CJK SC:size=13}${execi 3600 python3 /cpp/conkyrc/scripts/lunar.py}${font}${color}
${color1}${hr 1}${color}
#
# ── SYSTEM ──────────────────────────────────────────
#
${color1}${font DejaVu Sans Mono:bold:size=16}SYSTEM${font}${color}
${color1}${hr 1}${color}
${color3}Host${color}${goto 132}${color4}${nodename}${color}
${color3}OS${color}${goto 132}${execi 3600 lsb_release -ds 2>/dev/null || grep PRETTY_NAME /etc/os-release | cut -d'"' -f2}
${color3}Kernel${color}${goto 132}${kernel}
${color3}Uptime${color}${goto 132}${uptime}
${color3}Load${color}${goto 132}${loadavg}
${color3}Processes${color}${goto 132}${processes} total${goto 314}${running_processes} running
${color3}RAM${color}${goto 132}${mem} / ${memmax}${alignr}${memperc}%
${color2}${membar 10}${color}
${color3}Public IP${color}${goto 132}${execi 300 curl -s --max-time 5 ifconfig.me}
${color3}Proxy${color}${goto 132}${execi 30 bash /cpp/conkyrc/scripts/proxy_status.sh}
#
# ── CPU ─────────────────────────────────────────────
#
${voffset 6}${color1}${font DejaVu Sans Mono:bold:size=16}CPU${font}  ${font DejaVu Sans Mono:size=11}Ryzen 9 5950X  16C/32T${font}${color}
${color1}${hr 1}${color}
${color3}Total${color}${goto 132}${cpu cpu0}%${goto 254}${color3}Tctl${color}${goto 326}${hwmon 3 temp 1}°C
${color2}${cpugraph cpu0 50,460 e07800 ff8c00 -t}${color}
${voffset 2}\
${color1}CCD1${color}  ${color3}Cores 0–7${color}${alignr}${hwmon 3 temp 3}°C
${color3}C01${color}${goto 36}${color2}${cpubar cpu1 10,138}${color}${goto 178}${cpu cpu1}%${goto 222}${color2}${cpubar cpu17 10,138}${color}${goto 366}${cpu cpu17}%${alignr}${color3}${freq_g 1}G${color}
${color3}C02${color}${goto 36}${color2}${cpubar cpu2 10,138}${color}${goto 178}${cpu cpu2}%${goto 222}${color2}${cpubar cpu18 10,138}${color}${goto 366}${cpu cpu18}%${alignr}${color3}${freq_g 2}G${color}
${color3}C03${color}${goto 36}${color2}${cpubar cpu3 10,138}${color}${goto 178}${cpu cpu3}%${goto 222}${color2}${cpubar cpu19 10,138}${color}${goto 366}${cpu cpu19}%${alignr}${color3}${freq_g 3}G${color}
${color3}C04${color}${goto 36}${color2}${cpubar cpu4 10,138}${color}${goto 178}${cpu cpu4}%${goto 222}${color2}${cpubar cpu20 10,138}${color}${goto 366}${cpu cpu20}%${alignr}${color3}${freq_g 4}G${color}
${color3}C05${color}${goto 36}${color2}${cpubar cpu5 10,138}${color}${goto 178}${cpu cpu5}%${goto 222}${color2}${cpubar cpu21 10,138}${color}${goto 366}${cpu cpu21}%${alignr}${color3}${freq_g 5}G${color}
${color3}C06${color}${goto 36}${color2}${cpubar cpu6 10,138}${color}${goto 178}${cpu cpu6}%${goto 222}${color2}${cpubar cpu22 10,138}${color}${goto 366}${cpu cpu22}%${alignr}${color3}${freq_g 6}G${color}
${color3}C07${color}${goto 36}${color2}${cpubar cpu7 10,138}${color}${goto 178}${cpu cpu7}%${goto 222}${color2}${cpubar cpu23 10,138}${color}${goto 366}${cpu cpu23}%${alignr}${color3}${freq_g 7}G${color}
${color3}C08${color}${goto 36}${color2}${cpubar cpu8 10,138}${color}${goto 178}${cpu cpu8}%${goto 222}${color2}${cpubar cpu24 10,138}${color}${goto 366}${cpu cpu24}%${alignr}${color3}${freq_g 8}G${color}
${voffset 4}\
${color1}CCD2${color}  ${color3}Cores 8–15${color}${alignr}${hwmon 3 temp 4}°C
${color3}C09${color}${goto 36}${color2}${cpubar cpu9 10,138}${color}${goto 178}${cpu cpu9}%${goto 222}${color2}${cpubar cpu25 10,138}${color}${goto 366}${cpu cpu25}%${alignr}${color3}${freq_g 9}G${color}
${color3}C10${color}${goto 36}${color2}${cpubar cpu10 10,138}${color}${goto 178}${cpu cpu10}%${goto 222}${color2}${cpubar cpu26 10,138}${color}${goto 366}${cpu cpu26}%${alignr}${color3}${freq_g 10}G${color}
${color3}C11${color}${goto 36}${color2}${cpubar cpu11 10,138}${color}${goto 178}${cpu cpu11}%${goto 222}${color2}${cpubar cpu27 10,138}${color}${goto 366}${cpu cpu27}%${alignr}${color3}${freq_g 11}G${color}
${color3}C12${color}${goto 36}${color2}${cpubar cpu12 10,138}${color}${goto 178}${cpu cpu12}%${goto 222}${color2}${cpubar cpu28 10,138}${color}${goto 366}${cpu cpu28}%${alignr}${color3}${freq_g 12}G${color}
${color3}C13${color}${goto 36}${color2}${cpubar cpu13 10,138}${color}${goto 178}${cpu cpu13}%${goto 222}${color2}${cpubar cpu29 10,138}${color}${goto 366}${cpu cpu29}%${alignr}${color3}${freq_g 13}G${color}
${color3}C14${color}${goto 36}${color2}${cpubar cpu14 10,138}${color}${goto 178}${cpu cpu14}%${goto 222}${color2}${cpubar cpu30 10,138}${color}${goto 366}${cpu cpu30}%${alignr}${color3}${freq_g 14}G${color}
${color3}C15${color}${goto 36}${color2}${cpubar cpu15 10,138}${color}${goto 178}${cpu cpu15}%${goto 222}${color2}${cpubar cpu31 10,138}${color}${goto 366}${cpu cpu31}%${alignr}${color3}${freq_g 15}G${color}
${color3}C16${color}${goto 36}${color2}${cpubar cpu16 10,138}${color}${goto 178}${cpu cpu16}%${goto 222}${color2}${cpubar cpu32 10,138}${color}${goto 366}${cpu cpu32}%${alignr}${color3}${freq_g 16}G${color}
${voffset 4}\
${color3}Top Processes${alignr}CPU%${color}
${color4} ${top name 1}${color}${alignr}${top cpu 1}%
 ${top name 2}${alignr}${top cpu 2}%
 ${top name 3}${alignr}${top cpu 3}%
 ${top name 4}${alignr}${top cpu 4}%
 ${top name 5}${alignr}${top cpu 5}%
#
# ── DISK ────────────────────────────────────────────
#
${voffset 6}${color1}${font DejaVu Sans Mono:bold:size=16}DISK${font}${color}
${color1}${hr 1}${color}
${color4}/${color}  ${color3}WD SN770 · nvme1n1${color}
${color2}${fs_bar 10 /}${color}
${color3}Used${color} ${fs_used /} / ${fs_size /}${alignr}${fs_used_perc /}%
${color3}Read${color}${goto 132}${diskio_read /dev/nvme1n1}${goto 254}${color3}Write${color}${goto 338}${diskio_write /dev/nvme1n1}
${color2}${diskiograph_read /dev/nvme1n1 36,206 e07800 ff8c00 -t -l}${color}${goto 254}${color2}${diskiograph_write /dev/nvme1n1 36,206 e07800 ff8c00 -t -l}${color}
#
# ── NETWORK ─────────────────────────────────────────
#
${voffset 6}${color1}${font DejaVu Sans Mono:bold:size=16}NETWORK${font}${color}
${color1}${hr 1}${color}
${color4}wlp37s0${color}  ${color3}WiFi${color}${alignr}${if_up wlp37s0}${color6}UP${color}${else}${color5}DOWN${color}${endif}
${if_up wlp37s0}\
${color3}IP${color}${goto 132}${addr wlp37s0}
${color3}Down${color}${goto 132}${downspeed wlp37s0}${goto 254}${color3}Up${color}${goto 338}${upspeed wlp37s0}
${color2}${downspeedgraph wlp37s0 36,206 e07800 ff8c00 -l}${color}${goto 254}${color2}${upspeedgraph wlp37s0 36,206 e07800 ff8c00 -l}${color}
${endif}\
${color4}lo${color}  ${color3}Loopback${color}${alignr}${if_up lo}${color6}UP${color}${else}${color5}DOWN${color}${endif}
${if_up lo}\
${color3}IP${color}${goto 132}${addr lo}
${color3}Down${color}${goto 132}${downspeed lo}${goto 254}${color3}Up${color}${goto 338}${upspeed lo}
${color2}${downspeedgraph lo 36,206 e07800 ff8c00 -l}${color}${goto 254}${color2}${upspeedgraph lo 36,206 e07800 ff8c00 -l}${color}
${endif}\
${color4}enp35s0np0${color}  ${color3}Ethernet${color}${alignr}${if_up enp35s0np0}${color6}UP${color}${else}${color5}DOWN${color}${endif}
${if_up enp35s0np0}\
${color3}IP${color}${goto 132}${addr enp35s0np0}
${color3}Down${color}${goto 132}${downspeed enp35s0np0}${goto 254}${color3}Up${color}${goto 338}${upspeed enp35s0np0}
${color2}${downspeedgraph enp35s0np0 36,206 e07800 ff8c00 -l}${color}${goto 254}${color2}${upspeedgraph enp35s0np0 36,206 e07800 ff8c00 -l}${color}
${endif}\
#
# ── GPU ─────────────────────────────────────────────
#
${voffset 6}${color1}${font DejaVu Sans Mono:bold:size=16}GPU${font}  ${font DejaVu Sans Mono:size=11}GeForce RTX 2080${font}${color}
${color1}${hr 1}${color}
${color3}Temp${color}${goto 132}${execi 5 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits}°C${goto 254}${color3}Fan${color}${goto 338}${execi 5 nvidia-smi --query-gpu=fan.speed --format=csv,noheader,nounits}%
${color3}GPU Load${color}${goto 132}${execi 5 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits}%
${color2}${execigraph 5 "nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits" 50,460 e07800 ff8c00 -t 100}${color}
${color3}VRAM${color}${goto 132}${execi 5 nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits} / ${execi 5 nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits} MiB
${color2}${execibar 5 nvidia-smi --query-gpu=utilization.memory --format=csv,noheader,nounits}${color}
${color3}Power${color}${goto 132}${execi 5 nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits} W${goto 254}${color3}Driver${color}${goto 338}${execi 3600 nvidia-smi --query-gpu=driver_version --format=csv,noheader}
${voffset 5}
]]
